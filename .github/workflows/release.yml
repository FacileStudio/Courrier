name: Release

# Courrier's GitHub release is created by hand (gh release create vX.Y.Z), so the
# APK is attached once that release is published. workflow_dispatch rebuilds and
# re-attaches it for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: check signing secrets
        run: |
          missing=0
          for v in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::secret for $v is empty"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: gradle/actions/setup-gradle@v5

      - name: decode keystore
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/courrier.keystore"
          test -s "$RUNNER_TEMP/courrier.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/courrier.keystore" >> "$GITHUB_ENV"

      - name: compute version
        run: |
          version="${TAG#v}"
          core="${version%%[-+]*}"
          major="$(echo "$core" | cut -d. -f1)"
          minor="$(echo "$core" | cut -d. -f2)"
          patch="$(echo "$core" | cut -d. -f3)"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "COURRIER_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "COURRIER_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "version $version, code $code"

      - name: build web app
        working-directory: apps/client
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx cap sync android

      - name: build apk
        working-directory: apps/client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: verify and stage apk
        run: |
          apk=apps/client/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "$apk"
          count="$(find apps/client/android/app/build/outputs/apk/release -name '*.apk' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one universal APK, found $count"
            exit 1
          fi
          cp "$apk" courrier-android.apk
          sha256sum courrier-android.apk > courrier-android.apk.sha256
          cat courrier-android.apk.sha256

      - name: upload to release
        run: gh release upload "$TAG" courrier-android.apk courrier-android.apk.sha256 --clobber

      - name: remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/courrier.keystore"
