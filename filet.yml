# The Go family's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      format, rules, analyzers, tests, fuzz seeds and douane
#
# `preset: facile` is the suite standard (limits, style bans, failOn: error and
# the apps/api, apps/client layout). Lists in a preset are replaced, not
# merged, so an exception restates the whole list.

preset: facile
kind: app

# gofmt -l . also lists apps/api/vendor, which holds upstream code nobody here
# formats. scripts/check.sh runs gofmt with vendor/ excluded, and so does CI.
gate:
  disable: [gofmt]
