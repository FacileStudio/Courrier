services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-courrier_db}
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  courrier:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.courrier-web.rule: Host(`courrier.facile.studio`)
      traefik.http.routers.courrier-web.entrypoints: web
      traefik.http.routers.courrier-web.middlewares: redirect-to-https@file
      traefik.http.routers.courrier-web.service: courrier-svc
      traefik.http.routers.courrier-secure.rule: Host(`courrier.facile.studio`)
      traefik.http.routers.courrier-secure.entrypoints: websecure
      traefik.http.routers.courrier-secure.tls.certresolver: letsencrypt
      traefik.http.routers.courrier-secure.service: courrier-svc
      traefik.http.services.courrier-svc.loadbalancer.server.port: '4000'
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4000"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-courrier_db}
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DIR: ${STORAGE_DIR:-/data}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CLIENT_DIR: /client
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - api_data:/data
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  db_data:
    name: courrier_db_data
  api_data:
    name: courrier_api_data
networks:
  dokploy-network:
    external: true